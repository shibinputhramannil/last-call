# Render Blueprint for Last Call.
# One web service serves the game page, the room API and the WebSocket from a
# single Node process. Set up: Render Dashboard > New > Blueprint > this repo.
#
# Keep this service at ONE instance and do not turn on autoscaling: live rooms
# are held by one server process, so a second instance would not see them.
services:
  - type: web
    name: last-call
    runtime: node
    # Free instances sleep after 15 minutes without players and take about a
    # minute to wake. Change to "starter" (paid) for an always-on server.
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    # Deploy each push to the branch, but only after the GitHub CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      # Render sits behind Cloudflare. Its X-Forwarded-For ends in a rotating
      # proxy address, so per-player rate limits use Cloudflare's
      # CF-Connecting-IP header, which always holds the real client IP.
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: LOG_LEVEL
        value: info
      # Signs the campaign progress and room tickets that players' browsers
      # keep. With it, a restart or redeploy never loses a team's progress and
      # rooms rebuild themselves when players reconnect. Render generates it
      # once; keep it unchanged, or every saved game stops verifying.
      - key: SAVE_SECRET
        generateValue: true
      # Statistics history and admin sessions. A PostgreSQL connection URL
      # (Render Postgres "Internal Database URL", or Neon/Supabase with
      # ?sslmode=require). Without it, statistics live in memory only and the
      # admin dashboard says so. Secret: set it in the dashboard, never here.
      - key: DATABASE_URL
        sync: false
      # The private /admin dashboard. Generate all three with
      # `npm run admin:setup` on your own computer, then paste them into the
      # service's Environment tab. Leave them unset to keep /admin switched off.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      # Optional Claude narrator. Leave off unless you add an API key below.
      - key: ENABLE_AI_NARRATOR
        value: "false"
      # Secret: Render asks for it when the Blueprint is created; leave blank to skip.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional, for full room persistence (chat and the stage in progress
      # survive restarts too). Needs a paid instance with a persistent disk,
      # and a disk turns off zero-downtime deploys. Uncomment both blocks:
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: last-call-data
    #   mountPath: /var/data
    #   sizeGB: 1
